spring:
  datasource:
    url: jdbc:h2:mem:document-task-runner-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  task:
    scheduling:
      enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

task-runner:
  max-concurrency: 2
  scheduler:
    polling-interval-ms: 100
  retry:
    max-attempts: 3
    initial-delay-ms: 50
    multiplier: 2.0
  execution:
    default-duration-min-ms: 10
    default-duration-max-ms: 20
    timeout-seconds: 1
